name: KS Pipeline

on:
  workflow_dispatch:
    inputs:
      solution_name:
        description: 'Solution Name'
        required: true
        type: string

permissions:
  contents: write

jobs:
  export-solution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: Develop
          fetch-depth: 0

      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Authenticate to Dataverse
        run: |
          $POWERPLATFORMTOOLS_PACPATH auth create \
            --applicationId "${{ vars.POWERPLATFORM_APP_ID }}" \
            --clientSecret "${{ secrets.POWERPLATFORM_CLIENT_SECRET }}" \
            --tenant "${{ vars.POWERPLATFORM_TENANT_ID }}" \
            --environment "${{ vars.DEV_ENV_URL }}"

      - name: Export Unmanaged Solution
        run: |
          $POWERPLATFORMTOOLS_PACPATH solution export \
            --name "${{ github.event.inputs.solution_name }}" \
            --path "${{ github.event.inputs.solution_name }}.zip" \
            --managed false

      - name: Export Managed Solution
        run: |
          $POWERPLATFORMTOOLS_PACPATH solution export \
            --name "${{ github.event.inputs.solution_name }}" \
            --path "${{ github.event.inputs.solution_name }}_managed.zip" \
            --managed true

      - name: Create Artifact Folders
        run: |
          mkdir -p artifacts/solutions/unmanaged
          mkdir -p artifacts/solutions/managed

      - name: Copy Unmanaged Solution
        run: |
          cp "${{ github.event.inputs.solution_name }}.zip" \
          "artifacts/solutions/unmanaged/${{ github.event.inputs.solution_name }}.zip"

      - name: Copy Managed Solution
        run: |
          cp "${{ github.event.inputs.solution_name }}_managed.zip" \
          "artifacts/solutions/managed/${{ github.event.inputs.solution_name }}.zip"

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add artifacts/

          git commit -m "Export ${{ github.event.inputs.solution_name }} managed and unmanaged solutions" || echo "No changes detected"

          git push origin Develop

      - name: Clear Authentication
        run: |
          $POWERPLATFORMTOOLS_PACPATH auth clear
